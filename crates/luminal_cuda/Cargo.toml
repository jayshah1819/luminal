[package]
name = "luminal_cuda"
version = "0.2.0"
edition = "2021"
description = "Cuda compiler for luminal"
license = "MIT OR Apache-2.0"

[dependencies]
luminal = { path = "../.." }
cudarc = { version = "0.16.6", features = [
    "f16",       
    "cuda-11080", # CUDA 11.8 for AWS Deep Learning AMI
    "cudnn"       # Required for INT8 optimizations
] }
itertools = "0.12.1"
rustc-hash = "2.1.1"
half = "2.3.1"       
num-traits = "0.2.16"      
regex = "1.10.4"          
indicatif = "0.17.8"      

[dev-dependencies]
rand = "0.9.2"
paste = "1.0.14"
luminal_nn = { path = "../../crates/luminal_nn" }